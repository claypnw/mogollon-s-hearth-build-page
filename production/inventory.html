<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Mogollon's Hearth Props — Master View</title>
<style>
  :root {
    --bg: #e7e1d4; --paper: #f3eee3; --paper-2: #ddd4c3;
    --ink: #211e19; --muted: #5d584f; --line: #8f8068;
    --line-soft: rgba(80, 68, 51, .22);
    --wood: #542d1b; --wood-deep: #2f1a12;
    --ember: #b54f24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Source Sans 3", "Trebuchet MS", sans-serif;
    font-size: 16px; line-height: 1.5; padding: 24px 16px 60px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { font-family: Georgia, serif; margin: 0 0 4px; font-size: 2rem; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .sub a { color: inherit; }
  .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  #search {
    flex: 1 1 240px; padding: 10px 14px; font: inherit;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  }
  #count { color: var(--muted); white-space: nowrap; }
  .table-wrap {
    overflow-x: auto; background: var(--paper);
    border: 1px solid var(--line-soft); box-shadow: 0 16px 38px rgba(40,29,18,.18);
  }
  table { width: 100%; border-collapse: collapse; font-size: .93rem; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  thead th {
    background: var(--wood-deep); color: #f7edde; font-family: Georgia, serif;
    white-space: nowrap; cursor: pointer; user-select: none; position: sticky; top: 0;
  }
  thead th:hover { background: var(--ember); }
  thead th .dir { color: #e8834d; margin-left: 6px; }
  thead th.no-sort { cursor: default; }
  thead th.no-sort:hover { background: var(--wood-deep); }
  tbody tr:hover { background: var(--paper-2); }
  td:first-child { font-weight: 700; color: var(--ember); white-space: nowrap; }
  td img { width: 72px; height: 72px; object-fit: contain; display: block; border: 1px solid var(--line-soft); background: var(--paper-2); }
  #status { padding: 40px; text-align: center; color: var(--muted); }
  .err { color: #a33; }
</style>
</head>
<body>
<div class="wrap">
  <h1>My Mogollon's Hearth Props</h1>
  <p class="sub">Master view — reads the <a href="hearth-prop-inventory.md">master file</a> live. Edit that file on GitHub, then say "propagate". Tap a column heading to sort.</p>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search items…" aria-label="Search items" />
    <span id="count"></span>
  </div>
  <div class="table-wrap">
    <table id="t" aria-label="Prop inventory master view">
      <thead><tr>
        <th data-k="n" data-t="num">#<span class="dir"></span></th>
        <th class="no-sort">Photo</th>
        <th data-k="item" data-t="str">Item<span class="dir"></span></th>
        <th data-k="use" data-t="str">Where / how used<span class="dir"></span></th>
        <th data-k="notes" data-t="str">Notes<span class="dir"></span></th>
      </tr></thead>
      <tbody id="body"><tr><td colspan="5" id="status">Loading the master file…</td></tr></tbody>
    </table>
  </div>
</div>
<script>
(function () {
  var body = document.getElementById('body');
  var search = document.getElementById('search');
  var count = document.getElementById('count');
  var rows = [];
  var dir = 1, lastK = 'n';

  function parseMD(text) {
    var out = [];
    var lines = text.split('\n');
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!/^\|/.test(line)) continue;
      var cells = line.split('|').slice(1, -1).map(function (c) { return c.trim(); });
      if (cells.length < 5) continue;
      if (/^:?-{2,}:?$/.test(cells[0])) continue;      // separator row
      if (!/^\d+$/.test(cells[0])) continue;           // header row
      var photos = [];
      var re = /!\[.*?\]\((.*?)\)/g, m;
      while ((m = re.exec(cells[1])) photos.push(m[1]);
      out.push({ n: parseInt(cells[0], 10), photos: photos, item: cells[2], use: cells[3], notes: cells[4] });
    }
    return out;
  }

  function render() {
    var q = search.value.trim().toLowerCase();
    var list = rows.filter(function (r) {
      return !q || (r.item + ' ' + r.use + ' ' + r.notes).toLowerCase().indexOf(q) !== -1;
    });
    list.sort(function (a, b) {
      var k = lastK, cmp;
      if (k === 'n') cmp = a.n - b.n;
      else cmp = String(a[k]).localeCompare(String(b[k]));
      return cmp * dir;
    });
    if (!list.length) {
      body.innerHTML = '<tr><td colspan="5" id="status">No items match.</td></tr>';
    } else {
      body.innerHTML = list.map(function (r) {
        var img = r.photos.map(function (p, i) {
          return '<a href="item.html?n=' + r.n + '"><img src="' + p + '?v=2" alt="Item ' + r.n + ' photo ' + (i + 1) + '" loading="lazy"></a>';
        }).join('');
        return '<tr><td>' + r.n + '</td><td>' + img + '</td><td>' +
          esc(r.item) + '</td><td>' + esc(r.use) + '</td><td>' + esc(r.notes) + '</td></tr>';
      }).join('');
    }
    count.textContent = list.length + ' of ' + rows.length + ' items';
  }

  function esc(t) {
    return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  document.querySelectorAll('thead th[data-k]').forEach(function (th) {
    th.addEventListener('click', function () {
      var k = th.getAttribute('data-k');
      if (k === lastK) dir = -dir; else { dir = 1; lastK = k; }
      document.querySelectorAll('thead .dir').forEach(function (el) { el.textContent = ''; });
      th.querySelector('.dir').textContent = dir === 1 ? '▲' : '▼';
      render();
    });
  });
  search.addEventListener('input', render);

  fetch('hearth-prop-inventory.md', { cache: 'no-store' })
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(function (text) {
      rows = parseMD(text);
      if (!rows.length) throw new Error('no rows parsed');
      document.querySelector('thead th[data-k="n"] .dir').textContent = '▲';
      render();
    })
    .catch(function (err) {
      body.innerHTML = '<tr><td colspan="5" id="status" class="err">Could not load the master file: ' +
        esc(err.message) + '</td></tr>';
    });
})();
</script>
</body>
</html>
